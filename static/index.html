<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DGX Spark Cluster Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23070b12'/><path d='M10 24V9h6a6 6 0 0 1 0 12h-3' fill='none' stroke='%23374a5e' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><path d='M22 24l3-3m-3 3l3 3' stroke='%234b5563' stroke-width='2.5' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">DGX <span>Spark</span> Cluster Dashboard</div>
  <div id="status" class="status"><span class="dot"></span><span id="status-text">connecting…</span></div>
  <div id="tokens" class="tokens" hidden></div>
  <div id="live" class="live" hidden>LIVE</div>
</header>

<nav class="controls">
  <div class="ctl-group">
    <span class="ctl-label">poll</span>
    <button data-poll="250">250ms</button>
    <button data-poll="500">500ms</button>
    <button data-poll="1000">1s</button>
    <button data-poll="2000">2s</button>
    <button data-poll="5000" class="active">5s</button>
  </div>
  <div class="ctl-group">
    <span class="ctl-label">view</span>
    <button id="view-per" class="active">per node</button>
    <button id="view-agg">aggregated</button>
  </div>
  <div class="ctl-group">
    <span class="ctl-label">window</span>
    <button data-win="0" class="active">live</button>
    <button data-win="30">30s</button>
    <button data-win="120">2m</button>
    <button data-win="600">10m</button>
  </div>
  <div class="ctl-group">
    <span class="ctl-label">unavailable</span>
    <button id="unav-hide" class="active">hide</button>
    <button id="unav-show">show</button>
  </div>
  <div class="ctl-group">
    <span class="ctl-label">theme</span>
    <select id="theme">
      <option value="default">Default (dark)</option>
      <option value="retro">Retro (pixel)</option>
      <option value="matrix">Matrix</option>
      <option value="amber">Amber Terminal</option>
      <option value="cyberpunk">Cyberpunk</option>
      <option value="nord">Nord</option>
      <option value="oled">OLED Black</option>
      <option value="paper">Paper</option>
      <option value="midnight">Midnight Blue</option>
      <option value="forest">Forest</option>
      <option value="sunset">Sunset</option>
      <option value="light">Light</option>
    </select>
  </div>
  <div class="ctl-group">
    <button id="alerts-toggle">alerts</button>
  </div>
</nav>

<section id="alerts-panel" hidden>
  <span class="ctl-label">alert when metric exceeds</span>
  <div id="alerts-list" class="alerts-list"></div>
</section>

<section id="tiles" class="tiles"></section>

<section class="plots">
  <div class="plot">
    <div class="plot-head"><div class="plot-title">Temperature (°C)<span class="stat"></span></div><div class="legend"></div></div>
    <canvas id="plot-temp"></canvas>
  </div>
  <div class="plot">
    <div class="plot-head"><div class="plot-title">Power (W)<span class="stat"></span></div><div class="legend"></div></div>
    <canvas id="plot-power"></canvas>
  </div>
  <div class="plot">
    <div class="plot-head"><div class="plot-title">Clocks (MHz)<span class="stat"></span></div><div class="legend"></div></div>
    <canvas id="plot-clock"></canvas>
  </div>
  <div class="plot">
    <div class="plot-head"><div class="plot-title">Utilization (%)<span class="stat"></span></div><div class="legend"></div></div>
    <canvas id="plot-util"></canvas>
  </div>
  <div class="plot">
    <div class="plot-head"><div class="plot-title">Tokens (/s)<span class="stat"></span></div><div class="legend"></div></div>
    <canvas id="plot-tokens"></canvas>
  </div>
  <div class="plot">
    <div class="plot-head"><div class="plot-title">Active Requests<span class="stat"></span></div><div class="legend"></div></div>
    <canvas id="plot-req"></canvas>
  </div>
</section>

<footer class="foot">
  <span id="source"></span>
  <span>time window: recent (decimating) — tab-local, no server storage</span>
</footer>

<script src="app.js"></script>
</body>
</html>
