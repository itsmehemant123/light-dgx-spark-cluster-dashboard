# Template nginx "server {}" block to reverse-proxy the dashboard.
# The dashboard itself binds to 127.0.0.1:8088 (see the systemd unit); nginx
# exposes it on the LAN. SSE-friendly: buffering is disabled for the metrics
# stream and the read timeout is long.
#
# Install:
#   sudo cp nginx-dash.conf /etc/nginx/sites-available/dash
#   sudo ln -sf /etc/nginx/sites-available/dash /etc/nginx/sites-enabled/dash
#   (optional) sudo htpasswd -c /etc/nginx/.htpasswd-dash admin
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # --- optional basic auth for the whole dashboard ---
    # auth_basic "DGX Spark Dashboard";
    # auth_basic_user_file /etc/nginx/.htpasswd-dash;

    # backend dashboard (same host, loopback)
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- SSE stream: MUST NOT be buffered ---
    location = /api/metrics/push {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;          # stream events to the browser immediately
        proxy_cache off;
        proxy_read_timeout 3600s;     # keep the long-lived connection open
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }
}
